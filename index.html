<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
        }
        .device-card {
            transition: all 0.3s ease;
        }
        .device-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div id="loginPage" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Smart Home Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-gray-700">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors">
                    Login
                </button>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen bg-gray-100">
        <nav class="bg-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between items-center h-16">
                    <h1 class="text-xl font-semibold">Smart Home Dashboard</h1>
                    <button id="logoutBtn" class="text-gray-600 hover:text-gray-800">
                        <i class="bi bi-box-arrow-right text-xl"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Lights -->
                <div class="device-card bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">Living Room Lights</h3>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" id="lightSwitch">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                        </label>
                    </div>
                    <div class="flex items-center gap-2">
                        <i class="bi bi-brightness-high text-xl"></i>
                        <input type="range" class="w-full" min="0" max="100" value="50" id="brightness">
                    </div>
                </div>

                <!-- Temperature -->
                <div class="device-card bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-lg font-semibold mb-4">Temperature Control</h3>
                    <div class="flex items-center justify-between">
                        <span class="text-3xl font-bold" id="tempDisplay">22°C</span>
                        <div class="flex gap-2">
                            <button class="p-2 bg-gray-100 rounded-full hover:bg-gray-200" id="tempDown">
                                <i class="bi bi-dash-lg"></i>
                            </button>
                            <button class="p-2 bg-gray-100 rounded-full hover:bg-gray-200" id="tempUp">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Security -->
                <div class="device-card bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-lg font-semibold mb-4">Security System</h3>
                    <div class="flex flex-col gap-4">
                        <button id="armSystem" class="bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600">
                            <i class="bi bi-shield-check"></i> Arm System
                        </button>
                        <button id="checkCameras" class="bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">
                            <i class="bi bi-camera-video"></i> Check Cameras
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Simple authentication (demo purposes only)
            if (username === 'admin' && password === 'admin') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                alert('Invalid credentials!');
            }
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        });

        // Light control
        const lightSwitch = document.getElementById('lightSwitch');
        const brightness = document.getElementById('brightness');

        lightSwitch.addEventListener('change', function() {
            brightness.disabled = !this.checked;
        });

        // Temperature control
        let temperature = 22;
        const tempDisplay = document.getElementById('tempDisplay');
        
        document.getElementById('tempUp').addEventListener('click', function() {
            if (temperature < 30) {
                temperature++;
                tempDisplay.textContent = `${temperature}°C`;
            }
        });

        document.getElementById('tempDown').addEventListener('click', function() {
            if (temperature > 16) {
                temperature--;
                tempDisplay.textContent = `${temperature}°C`;
            }
        });

        // Security system
        document.getElementById('armSystem').addEventListener('click', function() {
            this.classList.toggle('bg-green-500');
            this.classList.toggle('bg-red-500');
            this.innerHTML = this.classList.contains('bg-red-500') ? 
                '<i class="bi bi-shield-lock"></i> Disarm System' : 
                '<i class="bi bi-shield-check"></i> Arm System';
        });

        document.getElementById('checkCameras').addEventListener('click', function() {
            alert('Connecting to security cameras...');
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
